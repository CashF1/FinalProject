
<h1>Golf Leaderboard</h1>

<form method="get">
    <label for="tournament">Choose a tournament:</label>

    <select name="tournament" id="tournament">
        <option value="">All Tournaments</option>

        {% for tournament in tournaments %}
            <option value="{{ tournament.id }}"
                {% if selected_tournament == tournament.id|stringformat:"s" %}selected{% endif %}>
                {{ tournament.name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Filter Scores</button>
</form>

<hr>

{% if scores %}
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Tournament</th>
                <th>Strokes</th>
            </tr>
        </thead>

        <tbody>
            {% for score in scores %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ score.player }}</td>
                    <td>{{ score.tournament }}</td>
                    <td>{{ score.strokes }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% else %}
    <p>No scores found for this tournament yet.</p>
{% endif %}

<p><a href="/">Back to Home</a></p>
