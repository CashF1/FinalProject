<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Golf Leaderboard</title>
</head>
<body>
    <h1>Golf Leaderboard</h1>

    <a href="{% url 'score_create' %}">Enter Score</a>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Tournament</th>
                <th>Total Strokes</th>
            </tr>
        </thead>
    <tbody>
        {%for score in scores%}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{score.player}}</td>
                <td>{{score.tournament.name}}</td>
                <td>{{score.strokes}}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="4"> No scores have been entered yet.</td>
            </tr>
        {% endfor %}
    </tbody>
    </table>

    <p><a href="{% url 'home' %}">Home</a></p>
                
</body>
</html>
